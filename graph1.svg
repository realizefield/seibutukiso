<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif">
  <rect width="540" height="380" fill="#ffffff"/>

  <!-- ========== Y軸ラベル「二酸化炭素の吸収速度」（縦書き風） ========== -->
  <text x="15" y="38" font-size="14" font-weight="bold" fill="#1f2937">＋</text>
  <text x="15" y="58" font-size="13" fill="#1f2937">（吸収）</text>

  <g font-size="14" font-weight="bold" fill="#1f2937">
    <text x="35" y="105">二</text>
    <text x="35" y="125">酸</text>
    <text x="35" y="145">化</text>
    <text x="35" y="165">炭</text>
    <text x="35" y="185">素</text>
    <text x="35" y="205">の</text>
    <text x="35" y="225">吸</text>
    <text x="35" y="245">収</text>
    <text x="35" y="265">速</text>
    <text x="35" y="285">度</text>
  </g>

  <text x="15" y="320" font-size="14" font-weight="bold" fill="#1f2937">−</text>
  <text x="15" y="340" font-size="13" fill="#1f2937">（放出）</text>

  <!-- ========== Y軸 ========== -->
  <line x1="100" y1="30" x2="100" y2="335" stroke="#1f2937" stroke-width="2"/>
  <!-- Y軸の矢印 -->
  <polygon points="95,32 100,20 105,32" fill="#1f2937"/>

  <!-- ========== X軸（y=210 が CO2=0 のライン） ========== -->
  <line x1="100" y1="210" x2="510" y2="210" stroke="#1f2937" stroke-width="2"/>
  <polygon points="505,205 520,210 505,215" fill="#1f2937"/>
  <text x="60" y="215" font-size="14" font-weight="bold" fill="#1f2937">0</text>
  <text x="430" y="232" font-size="13" fill="#1f2937">光の強さ</text>

  <!-- ========== 呼吸速度（青色の点線ベースライン y=270） ========== -->
  <line x1="100" y1="270" x2="490" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ========== 見かけの光合成速度の折れ線（赤線） ========== -->
  <!-- 暗黒時(x=100, y=270)：呼吸のみ→CO2放出 -->
  <!-- 補償点(x=200, y=210)：CO2出入りなし -->
  <!-- 光飽和点(x=370, y=110)：頭打ち -->
  <!-- それ以後(x=490, y=110)：水平 -->
  <polyline points="100,270 200,210 370,110 490,110"
            fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- ========== 「見かけの光合成速度」ラベル（オレンジ） ========== -->
  <text x="270" y="85" font-size="15" font-weight="bold" fill="#f59e0b">見かけの光合成速度</text>

  <!-- ========== 呼吸速度の矢印（青、両端矢印） y=210 → y=270 ========== -->
  <line x1="265" y1="213" x2="265" y2="267" stroke="#0891b2" stroke-width="3"/>
  <polygon points="261,217 265,210 269,217" fill="#0891b2"/>
  <polygon points="261,263 265,270 269,263" fill="#0891b2"/>
  <text x="220" y="248" font-size="14" font-weight="bold" fill="#0891b2">呼吸速度</text>

  <!-- ========== 光合成速度の矢印（緑、両端矢印） y=110 → y=270 ========== -->
  <line x1="420" y1="113" x2="420" y2="267" stroke="#10b981" stroke-width="3"/>
  <polygon points="416,117 420,110 424,117" fill="#10b981"/>
  <polygon points="416,263 420,270 424,263" fill="#10b981"/>
  <text x="435" y="195" font-size="14" font-weight="bold" fill="#10b981">光合成速度</text>

  <!-- ========== 見かけの光合成速度の矢印（黄色、両端矢印） y=110 → y=210 ========== -->
  <line x1="370" y1="113" x2="370" y2="207" stroke="#eab308" stroke-width="3"/>
  <polygon points="366,117 370,110 374,117" fill="#eab308"/>
  <polygon points="366,203 370,210 374,203" fill="#eab308"/>

</svg>
