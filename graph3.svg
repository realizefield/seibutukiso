<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="'Noto Sans CJK JP','Hiragino Sans','Yu Gothic',sans-serif">
  <!-- ============================================================ -->
  <!-- 座標系                                                        -->
  <!--   原点 O = (140, 240)                                         -->
  <!--   横軸（光の強さ）：x = 140 → 660                              -->
  <!--   縦軸（CO2吸収速度）：y = 60 → 380                            -->
  <!--   ゼロライン y = 240                                          -->
  <!--                                                               -->
  <!--   陽性植物：補償点 P1 (大きい)、光飽和点 Q1 (右上、大きい)      -->
  <!--     呼吸 −60、最大 +130（飽和点 x=520, y=110）                 -->
  <!--   陰性植物：補償点 P2 (小さい)、光飽和点 Q2 (左、低い)         -->
  <!--     呼吸 −20、最大 +60（飽和点 x=280, y=180）                  -->
  <!-- ============================================================ -->

  <rect width="720" height="480" fill="#ffffff"/>

  <!-- タイトル -->
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">
    陽性植物と陰性植物の光合成速度
  </text>

  <!-- ============================================================ -->
  <!-- 縦軸                                                          -->
  <!-- ============================================================ -->
  <line x1="140" y1="380" x2="140" y2="50" stroke="#1f2937" stroke-width="2"/>
  <polygon points="140,50 135,60 145,60" fill="#1f2937"/>

  <!-- ＋（吸収）ラベル -->
  <text x="50" y="62" font-size="13" fill="#1f2937">＋</text>
  <text x="35" y="80" font-size="11" fill="#1f2937">（吸収）</text>

  <!-- 縦軸ラベル（縦書き） -->
  <text x="95" y="110" font-size="13" fill="#1f2937">二</text>
  <text x="95" y="128" font-size="13" fill="#1f2937">酸</text>
  <text x="95" y="146" font-size="13" fill="#1f2937">化</text>
  <text x="95" y="164" font-size="13" fill="#1f2937">炭</text>
  <text x="95" y="182" font-size="13" fill="#1f2937">素</text>
  <text x="95" y="205" font-size="13" fill="#1f2937">の</text>
  <text x="95" y="228" font-size="13" fill="#1f2937">吸</text>
  <text x="95" y="246" font-size="13" fill="#1f2937">収</text>
  <text x="95" y="264" font-size="13" fill="#1f2937">速</text>
  <text x="95" y="282" font-size="13" fill="#1f2937">度</text>

  <!-- 「0」 -->
  <text x="118" y="245" font-size="14" font-weight="bold" fill="#1f2937">0</text>

  <!-- −（放出）ラベル -->
  <text x="55" y="360" font-size="15" fill="#1f2937">−</text>
  <text x="35" y="380" font-size="11" fill="#1f2937">（放出）</text>

  <!-- ============================================================ -->
  <!-- 横軸（ゼロライン）                                            -->
  <!-- ============================================================ -->
  <line x1="140" y1="240" x2="660" y2="240" stroke="#1f2937" stroke-width="2"/>
  <polygon points="660,240 650,235 650,245" fill="#1f2937"/>
  <text x="608" y="263" font-size="13" fill="#1f2937">光の強さ</text>

  <!-- ============================================================ -->
  <!-- 陽性植物（赤）：呼吸 −60 (y=300), 最大+130 (y=110)             -->
  <!--   スタート(140,300) → 光飽和点Q1(520,110) → 水平(640,110)      -->
  <!-- ============================================================ -->
  <polyline points="140,300 520,110 640,110"
            fill="none" stroke="#dc2626" stroke-width="3.5"/>

  <!-- 陽性植物の呼吸の底（点線） -->
  <line x1="140" y1="300" x2="640" y2="300" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.45"/>

  <!-- ============================================================ -->
  <!-- 陰性植物（緑）：呼吸 −20 (y=260), 最大+60 (y=180)              -->
  <!--   スタート(140,260) → 光飽和点Q2(280,180) → 水平(640,180)      -->
  <!-- ============================================================ -->
  <polyline points="140,260 280,180 640,180"
            fill="none" stroke="#16a34a" stroke-width="3.5"/>

  <!-- 陰性植物の呼吸の底（点線） -->
  <line x1="140" y1="260" x2="640" y2="260" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.45"/>

  <!-- ============================================================ -->
  <!-- P1：陽性植物の補償点                                          -->
  <!--   直線(140,300)→(520,110)上で y=240 となる x                  -->
  <!--   傾き(110-300)/(520-140) = -190/380 = -0.5                   -->
  <!--   x = 140 + (240-300)/(-0.5) = 140 + 120 = 260                -->
  <!-- ============================================================ -->
  <circle cx="260" cy="240" r="5" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="248" y="248" width="26" height="22" rx="3" fill="#dc2626"/>
  <text x="261" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">P₁</text>

  <!-- ============================================================ -->
  <!-- P2：陰性植物の補償点                                          -->
  <!--   直線(140,260)→(280,180)上で y=240 となる x                  -->
  <!--   傾き(180-260)/(280-140) = -80/140 = -0.571                  -->
  <!--   x = 140 + (240-260)/(-0.571) = 140 + 35 = 175                -->
  <!-- ============================================================ -->
  <circle cx="175" cy="240" r="5" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
  <rect x="155" y="218" width="26" height="22" rx="3" fill="#16a34a"/>
  <text x="168" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">P₂</text>

  <!-- ============================================================ -->
  <!-- Q1：陽性植物の光飽和点 (520, 110)                              -->
  <!-- ============================================================ -->
  <circle cx="520" cy="110" r="5" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="528" y="92" width="26" height="22" rx="3" fill="#dc2626"/>
  <text x="541" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Q₁</text>

  <!-- ============================================================ -->
  <!-- Q2：陰性植物の光飽和点 (280, 180)                              -->
  <!-- ============================================================ -->
  <circle cx="280" cy="180" r="5" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
  <rect x="288" y="162" width="26" height="22" rx="3" fill="#16a34a"/>
  <text x="301" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Q₂</text>

  <!-- ============================================================ -->
  <!-- ラベル                                                        -->
  <!-- ============================================================ -->
  <!-- 陽性植物（赤直線の傾斜部分の上） -->
  <rect x="350" y="138" width="100" height="28" rx="5" fill="#dc2626"/>
  <text x="400" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">陽性植物</text>

  <!-- 陰性植物（緑直線の水平部分の上） -->
  <rect x="490" y="155" width="100" height="28" rx="5" fill="#16a34a"/>
  <text x="540" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">陰性植物</text>

  <!-- ============================================================ -->
  <!-- 凡例（左下）                                                  -->
  <!-- ============================================================ -->
  <g transform="translate(150,400)">
    <!-- 陽性植物の凡例 -->
    <line x1="0" y1="10" x2="30" y2="10" stroke="#dc2626" stroke-width="3.5"/>
    <text x="38" y="14" font-size="12" font-weight="bold" fill="#dc2626">陽性植物</text>
    <text x="105" y="14" font-size="11" fill="#1f2937">（イネ・ススキ・クロマツ）</text>

    <!-- 陰性植物の凡例 -->
    <line x1="0" y1="40" x2="30" y2="40" stroke="#16a34a" stroke-width="3.5"/>
    <text x="38" y="44" font-size="12" font-weight="bold" fill="#16a34a">陰性植物</text>
    <text x="105" y="44" font-size="11" fill="#1f2937">（コケ・シダ・アオキ）</text>
  </g>
</svg>
