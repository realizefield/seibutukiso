<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif">
  <defs>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- 太陽 -->
  <g>
    <circle cx="60" cy="60" r="32" fill="url(#sunGrad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="60" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">太陽</text>
    <!-- 光線 -->
    <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
      <line x1="100" y1="80" x2="200" y2="160"/>
      <line x1="105" y1="100" x2="210" y2="180"/>
      <line x1="110" y1="120" x2="220" y2="200"/>
    </g>
    <text x="135" y="155" font-size="13" font-weight="bold" fill="#d97706">光エネルギー</text>
  </g>

  <!-- 葉（楕円形） -->
  <ellipse cx="320" cy="200" rx="130" ry="75" fill="url(#leafGrad)" stroke="#15803d" stroke-width="2"/>
  <ellipse cx="320" cy="200" rx="120" ry="65" fill="none" stroke="#166534" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="320" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">葉緑体</text>
  <text x="320" y="215" text-anchor="middle" font-size="11" fill="#fff">（光合成の場所）</text>

  <!-- CO2（左から葉へ） -->
  <g>
    <rect x="200" y="245" width="60" height="28" rx="14" fill="#fff" stroke="#1e3a8a" stroke-width="2"/>
    <text x="230" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">CO₂</text>
    <line x1="263" y1="259" x2="295" y2="240" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="218" y="290" text-anchor="middle" font-size="11" fill="#475569">二酸化炭素</text>
    <text x="218" y="304" text-anchor="middle" font-size="10" fill="#475569">（気孔から）</text>
  </g>

  <!-- H2O（下から葉へ） -->
  <g>
    <rect x="380" y="295" width="60" height="28" rx="14" fill="#fff" stroke="#0891b2" stroke-width="2"/>
    <text x="410" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#0891b2">H₂O</text>
    <line x1="395" y1="295" x2="370" y2="265" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="410" y="340" text-anchor="middle" font-size="11" fill="#475569">水（根から）</text>
  </g>

  <!-- 有機物（葉から右へ） -->
  <g>
    <rect x="430" y="155" width="62" height="28" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="461" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">有機物</text>
    <line x1="430" y1="175" x2="395" y2="190" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="461" y="200" text-anchor="middle" font-size="10" fill="#92400e">（デンプンなど）</text>
  </g>

  <!-- 酸素（葉から上へ） -->
  <g>
    <rect x="350" y="100" width="50" height="28" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="375" y="119" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">O₂</text>
    <line x1="358" y1="135" x2="332" y2="160" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="375" y="92" text-anchor="middle" font-size="11" fill="#1e3a8a">酸素</text>
  </g>
</svg>
